<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Track - 商品价格看板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 商品价格看板</h1>
            <div class="update-date" id="updateDate"></div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>商品</th>
                    <th>收盘</th>
                    <th class="data-column">日</th>
                    <th class="data-column">5日</th>
                    <th class="data-column">20日</th>
                    <th class="data-column">YTD</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 数据会在这里插入 -->
            </tbody>
        </table>
    </div>

    <script>
        const fallbackData = {
            update_date: '2026-08-15',
            commodities: [
                { name: 'SHFE铜', price: '¥...', daily: '+0.8%', five_day: '+2.9%', twenty_day: '+6.1%', ytd: '+15%' },
                { name: 'SHFE铝', price: '¥...', daily: '+0.6%', five_day: '+1.7%', twenty_day: '+4.3%', ytd: '+9%' },
                { name: 'SHFE黄金', price: '¥...', daily: '+0.4%', five_day: '+1.2%', twenty_day: '+3.9%', ytd: '+11%' },
                { name: 'SHFE白银', price: '¥...', daily: '+1.1%', five_day: '+3.4%', twenty_day: '+7.8%', ytd: '+17%' },
                { name: 'SHFE螺纹钢', price: '¥...', daily: '-0.3%', five_day: '-1.6%', twenty_day: '-4.4%', ytd: '-2%' },
                { name: '碳酸锂', price: '¥...', daily: '-1.5%', five_day: '-4.2%', twenty_day: '-8.7%', ytd: '+12%' },
                { name: '布伦特石油', price: '$...', daily: '+0.9%', five_day: '+2.1%', twenty_day: '+5.6%', ytd: '+8%' }
            ]
        };

        function renderTable(data) {
            document.getElementById('updateDate').textContent = `更新于: ${data.update_date}`;

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.commodities.forEach(commodity => {
                const row = document.createElement('tr');

                const getClass = (value) => {
                    const numValue = parseFloat(value);
                    return numValue >= 0 ? 'positive' : 'negative';
                };

                row.innerHTML = `
                    <td class="commodity-name">${commodity.name}</td>
                    <td class="price">${commodity.price}</td>
                    <td class="data-column ${getClass(commodity.daily)}">${commodity.daily}</td>
                    <td class="data-column ${getClass(commodity.five_day)}">${commodity.five_day}</td>
                    <td class="data-column ${getClass(commodity.twenty_day)}">${commodity.twenty_day}</td>
                    <td class="data-column ${getClass(commodity.ytd)}">${commodity.ytd}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.warn('加载 data.json 失败，使用内置备用数据:', error);
                renderTable(fallbackData);
            }
        }

        loadData();
    </script>
</body>
</html>
