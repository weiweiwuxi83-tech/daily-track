<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Daily Track - 商品价格看板</title>
    <link rel="stylesheet" href="style.css?v=20260815-1">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 商品价格看板</h1>
            <div class="update-date" id="updateDate"></div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>商品</th>
                    <th>收盘</th>
                    <th class="data-column">日</th>
                    <th class="data-column">5日</th>
                    <th class="data-column">20日</th>
                    <th class="data-column">YTD</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 数据会在这里插入 -->
            </tbody>
        </table>
    </div>

    <script>
        const CACHE_VERSION = '20260815-2';
        const LIVE_API_URL = 'https://example.com/api/commodities';

        const fallbackData = {
            update_date: '2026-08-15',
            market_closed: true,
            commodities: [
                { name: '上海期货交易所-铜', source: '上海期货交易所（SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '上海期货交易所-铝', source: '上海期货交易所（SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '上海期货交易所-黄金', source: '上海期货交易所（SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '上海期货交易所-白银', source: '上海期货交易所（SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '上海期货交易所-螺纹钢', source: '上海期货交易所（SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '碳酸锂期货', source: '广州期货交易所/相关市场（非 SHFE）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' },
                { name: '布伦特原油', source: 'ICE布伦特（国际市场，不是大陆交易所）', price: '待更新', last_close: '待更新', market_closed: true, daily: '—', five_day: '—', twenty_day: '—', ytd: '—' }
            ]
        };

        function normalizeCommodity(item) {
            return {
                name: item.name || item.symbol || '未知商品',
                price: item.price || item.latestPrice || item.last_close || '待更新',
                last_close: item.last_close || item.previousClose || item.close || '待更新',
                market_closed: Boolean(item.market_closed),
                daily: item.daily || item.changePct || '—',
                five_day: item.five_day || item.change5d || '—',
                twenty_day: item.twenty_day || item.change20d || '—',
                ytd: item.ytd || item.ytdChange || '—'
            };
        }

        function getDisplayPrice(commodity) {
            if (commodity.market_closed && commodity.last_close && commodity.last_close !== '待更新') {
                return `${commodity.last_close}（最近交易日）`;
            }
            return commodity.price || commodity.last_close || '—';
        }

        function renderTable(data) {
            if (!data || !Array.isArray(data.commodities)) {
                renderTable(fallbackData);
                return;
            }

            const summaryText = data.market_closed
                ? `更新于: ${data.update_date}（按最近交易日收盘价，如未更新则显示待更新）`
                : `更新于: ${data.update_date}`;
            document.getElementById('updateDate').textContent = summaryText;

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            data.commodities.forEach(commodity => {
                const normalized = normalizeCommodity(commodity);
                const row = document.createElement('tr');

                const getClass = (value) => {
                    if (value === '—' || value === '待更新') return '';
                    const numValue = parseFloat(value);
                    return numValue >= 0 ? 'positive' : 'negative';
                };

                row.innerHTML = `
                    <td class="commodity-name">${normalized.name}</td>
                    <td class="price">${getDisplayPrice(normalized)}</td>
                    <td class="data-column ${getClass(normalized.daily)}">${normalized.daily}</td>
                    <td class="data-column ${getClass(normalized.five_day)}">${normalized.five_day}</td>
                    <td class="data-column ${getClass(normalized.twenty_day)}">${normalized.twenty_day}</td>
                    <td class="data-column ${getClass(normalized.ytd)}">${normalized.ytd}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        async function loadData() {
            const sources = [
                { url: LIVE_API_URL, label: 'live' },
                { url: `data.json?v=${CACHE_VERSION}`, label: 'local' }
            ];

            for (const source of sources) {
                try {
                    const response = await fetch(source.url, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    renderTable(data);
                    return;
                } catch (error) {
                    console.warn(`加载 ${source.label} 数据失败:`, error);
                }
            }

            console.warn('所有数据源失败，使用内置备用数据');
            renderTable(fallbackData);
        }

        loadData();
    </script>
</body>
</html>
