name: 🔄 定时更新商品价格

on:
  schedule:
    # 每天北京时间 8:30、10:30、14:30、16:30 运行（考虑市场开盘时间）
    - cron: '0 0,2,6,8 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-prices:
    runs-on: ubuntu-latest
    name: 更新商品价格
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install yfinance
          
      - name: 获取最新商品价格
        run: |
          python3 fetch_prices.py
          
      - name: 验证数据格式
        run: |
          python3 -m json.tool api/commodities.json > /dev/null && echo "✓ JSON 格式正确"
          
      - name: 提交更新（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/commodities.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 自动更新商品价格 - $(date +'%Y-%m-%d %H:%M:%S UTC')" && git push)
